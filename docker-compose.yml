services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GW_DATABASE_URL: postgresql+asyncpg://groundwork:groundwork@db:5432/groundwork
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
