[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "-n=auto"
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
]
branch = true
parallel = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]

[tool.black]
line-length = 100
target-version = ["py311"]
src = ["backend/", "tests/"]

[tool.isort]
profile = "black"
src_paths = ["backend/", "tests/"]
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",
    "E266",
    "E501",
    "W503",
    "W504",
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".coverage",
    "htmlcov",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]
select = [
    "E",
    "W",
    "F",
    "C90",
]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["backend/", "tests/"]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
]
