[project]
name = "groundwork"
version = "0.1.0"
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "authlib==1.7.2",
    "httpx==0.28.1",
    "aioboto3==15.5.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "itsdangerous==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    "isort==9.0.1",
    "flake8==7.3.0",
    "Flake8-pyproject==1.2.4",
    "mypy==2.1.0",
    "hypothesis==6.155.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "-n=auto"
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
]
branch = true
parallel = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]

[tool.black]
line-length = 100
target-version = ["py311"]
src = ["backend/", "tests/"]

[tool.isort]
profile = "black"
src_paths = ["backend/", "tests/"]
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",
    "E266",
    "E501",
    "W503",
    "W504",
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".coverage",
    "htmlcov",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]
select = [
    "E",
    "W",
    "F",
    "C90",
]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["backend/", "tests/"]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
]
