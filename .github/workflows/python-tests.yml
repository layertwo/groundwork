name: Python Tests

on:
  pull_request:
  push:
    branches: [ "mainline" ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      GW_DATABASE_URL: postgresql+asyncpg://groundwork:groundwork@localhost:5432/groundwork

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Check code formatting with black
        run: uv run black --check --diff backend/ tests/

      - name: Check import sorting with isort
        run: uv run isort --check-only --diff backend/ tests/

      - name: Run flake8 linting
        run: uv run flake8 backend/ tests/

      - name: Run unit tests
        run: uv run pytest
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}

      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
