name: Python Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
    branches: [ "mainline" ]
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
    branches: [ "mainline" ]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      GW_DATABASE_URL: postgresql+asyncpg://groundwork:groundwork@localhost:5432/groundwork

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Check code formatting with black
        run: |
          black --check --diff backend/ tests/

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff backend/ tests/

      - name: Run flake8 linting
        run: |
          flake8 backend/ tests/

      - name: Run tests with coverage
        run: |
          pytest
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}

      - name: Store coverage file
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download coverage artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
